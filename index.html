<script type="module">
        import { 
            db, auth, collection, addDoc, onSnapshot, 
            signInWithEmailAndPassword, createUserWithEmailAndPassword, 
            signOut, onAuthStateChanged 
        } from "./firebase-config.js";

        const ADMIN_EMAIL = "admin@efrin.com";
        let cart = [];
        let currentUser = null;

        // ربط الدوال صراحة بالنطاق العام لتعمل مع أحداث onclick في الأزرار
        window.openCartModal = () => document.getElementById('cart-modal').classList.remove('hidden');
        window.closeCartModal = () => document.getElementById('cart-modal').classList.add('hidden');
        window.openAuthModal = () => document.getElementById('auth-modal').classList.remove('hidden');
        window.closeAuthModal = () => document.getElementById('auth-modal').classList.add('hidden');
        window.scrollToProducts = () => document.getElementById('products-section').scrollIntoView({ behavior: 'smooth' });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateAuthUI();
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminOrders();
            } else {
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        function fetchProducts() {
            const grid = document.getElementById('products-grid');
            onSnapshot(collection(db, "products"), (snapshot) => {
                grid.innerHTML = '';
                if(snapshot.empty) {
                    grid.innerHTML = `<p class="text-slate-400 col-span-full text-center">لا توجد منتجات مضافة سحابياً بعد.</p>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const product = { id: docSnap.id, ...docSnap.data() };
                    grid.innerHTML += `
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-indigo-500 transition">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-40 object-cover">
                            <div class="p-4 flex flex-col flex-grow justify-between">
                                <div>
                                    <h3 class="font-bold text-lg mb-2">${product.name}</h3>
                                    <p class="text-emerald-400 font-black text-xl mb-4">$${Number(product.price).toFixed(2)}</p>
                                </div>
                                <button onclick='window.addToCart(${JSON.stringify(product)})' class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-xl font-bold text-sm transition">أضف إلى السلة</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.handleAddProduct = async function(event) {
            event.preventDefault();
            const name = document.getElementById('new-prod-name').value;
            const price = parseFloat(document.getElementById('new-prod-price').value);
            const image = document.getElementById('new-prod-image').value;
            try {
                await addDoc(collection(db, "products"), { name, price, image, createdAt: new Date() });
                document.getElementById('add-product-form').reset();
                alert('تمت إضافة المنتج بنجاح!');
            } catch (error) {
                alert('خطأ: ' + error.message);
            }
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                closeAuthModal();
                alert('تم تسجيل الدخول بنجاح!');
            } catch (error) {
                alert('فشل تسجيل الدخول: تأكد من صحة البيانات.');
            }
        }

        window.handleSignUp = async function() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) {
                alert('يرجى إدخال البريد وكلمة المرور.');
                return;
            }
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                closeAuthModal();
                alert('تم إنشاء الحساب بنجاح!');
            } catch (error) {
                alert('خطأ: ' + error.message);
            }
        }

        window.logout = async function() {
            await signOut(auth);
            alert('تم تسجيل الخروج.');
        }

        function updateAuthUI() {
            const container = document.getElementById('auth-nav-container');
            if (currentUser) {
                container.innerHTML = `
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <span class="text-xs bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">${currentUser.email}</span>
                        <button onclick="window.logout()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">خروج</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="window.openAuthModal()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold text-sm transition">تسجيل الدخول / إنشاء حساب</button>
                `;
            }
        }

        window.addToCart = function(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            window.updateCartUI();
            alert('تمت إضافة المنتج إلى السلة!');
        }

        window.updateCartUI = function() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalItems;

            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-700">
                        <div>
                            <h4 class="font-bold text-sm">${item.name}</h4>
                            <p class="text-xs text-slate-400">$${item.price} × ${item.qty}</p>
                        </div>
                        <button onclick="window.removeFromCart(${index})" class="text-red-400 hover:text-red-300 text-sm"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });

            document.getElementById('cart-total-price').innerText = `$${total.toFixed(2)}`;
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            window.updateCartUI();
        }

        window.checkout = async function() {
            if(!currentUser) {
                alert('يجب تسجيل الدخول أولاً لإتمام الطلب.');
                window.openAuthModal();
                return;
            }
            if(cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            try {
                const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                await addDoc(collection(db, "orders"), {
                    userEmail: currentUser.email,
                    items: cart,
                    total: total,
                    status: 'قيد المعالجة',
                    createdAt: new Date()
                });
                cart = [];
                window.updateCartUI();
                window.closeCartModal();
                alert('تم إرسال طلبك بنجاح!');
            } catch (error) {
                alert('خطأ: ' + error.message);
            }
        }

        function loadAdminOrders() {
            const ordersContainer = document.getElementById('admin-orders-list');
            onSnapshot(collection(db, "orders"), (snapshot) => {
                ordersContainer.innerHTML = '';
                if(snapshot.empty) {
                    ordersContainer.innerHTML = 'لا توجد طلبات حالياً.';
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const order = docSnap.data();
                    ordersContainer.innerHTML += `
                        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 mb-2">
                            <p class="text-xs text-indigo-400 font-bold">المستخدم: ${order.userEmail}</p>
                            <p class="text-xs text-slate-300">المجموع: $${order.total.toFixed(2)} | الحالة: ${order.status}</p>
                        </div>
                    `;
                });
            });
        }

        fetchProducts();
    </script>
